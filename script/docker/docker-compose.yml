name: snail-ai

services:
  mysql:
    image: mysql:8.4
    container_name: snail-ai-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-snail_ai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - /docker/mysql/data:/var/lib/mysql
      - ../sql/snail_ai_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    container_name: snail-ai-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - /docker/redis/data:/redis/data:rw
      - ./redis/conf/redis.conf:/redis/config/redis.conf:ro
    command: redis-server /redis/config/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: snail-ai-minio
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - /docker/minio/data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  ollama:
    image: ollama/ollama:0.5.7
    container_name: snail-ai-ollama
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - /docker/ollama:/root/.ollama
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-8G}

  snail-ai-server:
    build:
      context: ${SNAIL_AI_SOURCE_DIR:-../..}
      dockerfile: snail-ai-starter/Dockerfile
    image: ${SNAIL_AI_IMAGE:-opensnail/snail-ai:latest}
    container_name: snail-ai-server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${SNAIL_AI_JAVA_OPTS}
    ports:
      - "${SNAIL_AI_HTTP_PORT:-8900}:8900"
      - "${SNAIL_AI_GRPC_PORT:-18888}:18888"
    volumes:
      - /docker/snail-ai-server/log:/snailai/server/data/log
      - /docker/snail-ai-server/upload:/snailai/server/upload
    command:
      [
        "sh",
        "-c",
        "java $JAVA_OPTS -Djava.security.egd=file:/dev/./urandom -XX:+HeapDumpOnOutOfMemoryError -XX:+UseZGC -jar app.jar",
      ]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  snail-ai-agent-example:
    build:
      context: ${SNAIL_AI_SOURCE_DIR:-../..}
      dockerfile: snail-ai-agent-example/Dockerfile
    image: ${SNAIL_AI_AGENT_IMAGE:-opensnail/snail-ai-agent-example:latest}
    container_name: snail-ai-agent-example
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${SNAIL_AI_AGENT_JAVA_OPTS}
      PARAMS: ${SNAIL_AI_AGENT_PARAMS}
    ports:
      - "${SNAIL_AI_AGENT_HTTP_PORT:-8081}:8081"
      - "${SNAIL_AI_AGENT_GRPC_PORT:-18889}:18889"
    volumes:
      - /docker/snail-ai-agent/log:/snailai/agent/data/log
    depends_on:
      - snail-ai-server
